# [build]
# target = "riscv64gc-unknown-none-elf"
# target-dir = "./target"
# 
# [target.riscv64gc-unknown-none-elf]
# linker = "riscv64-unknown-elf-gcc"

[build]
target = "riscv64gc-unknown-linux-musl"
target-dir = "./target"

[target.riscv64gc-unknown-linux-musl]
linker = "riscv64-linux-musl-gcc"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
