[workspace]
members = ["test_vqueue"]
exclude = ["output/vdso_wrapper", "output/libvqueue"]

[package]
name = "vqueue"
version = "0.1.0"
edition = "2024"
description = "A queue management system, suitable for vDSO."

[dependencies]
lazyinit = "0.2.2"
